# CrazyWolves Community — Netlify konfiguracija
# Staticki sajt, bez build koraka.

[build]
  publish = "."
  command = ""

# Kes: HTML uvek svez da bi izmene bile odmah vidljive,
# a slike i stilovi dugo kesirani jer se menjaju retko.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
