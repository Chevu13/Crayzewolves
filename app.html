<!-- Pre-boot shell so there is never a flash of unstyled content -->
<style>
  #boot {
    position: fixed; inset: 0; z-index: 9999;
    display: grid; place-items: center;
    background: #0B0B0A;
    transition: opacity .3s ease, visibility .3s ease;
  }
  #boot.is-done { opacity: 0; visibility: hidden; }
  #boot .mark { animation: bootpulse 1.5s ease-in-out infinite; }
  @keyframes bootpulse { 0%,100% { opacity:.35 } 50% { opacity:1 } }
</style>
</head>

<div id="boot" aria-hidden="true">

<script>
  /* Boot ekran prekriva ceo ekran. Skidamo ga na 'load', ali NE oslanjamo se
     samo na njega: ako Google Fonts kasni ili je blokiran, 'load' ume da
     stigne sa velikim zakašnjenjem i korisnik gleda pulsirajući grb.
     Zato ga skida i DOMContentLoaded, i sigurnosni tajmer. */
  (function () {
    var done = false;
    function hideBoot() {
      if (done) return;
      done = true;
      var boot = document.getElementById('boot');
      if (!boot) return;
      boot.classList.add('is-done');
      setTimeout(function () { if (boot.parentNode) boot.parentNode.removeChild(boot); }, 320);
    }
    window.addEventListener('load', hideBoot);
    document.addEventListener('DOMContentLoaded', function () { setTimeout(hideBoot, 100); });
    setTimeout(hideBoot, 3000);           /* poslednja linija odbrane */
  })();
</script>
